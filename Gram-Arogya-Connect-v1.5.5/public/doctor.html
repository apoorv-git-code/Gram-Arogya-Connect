<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Shared Health Record · Gram Arogya Connect</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f8f6;color:#102a25;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.shell{width:min(920px,calc(100% - 32px));margin:38px auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand img{width:58px;height:58px;object-fit:contain;border-radius:50%;background:#fff}.brand strong{display:block;font-size:20px}.brand span{color:#647a75;font-size:13px}.card{background:#fff;border:1px solid #dce9e5;border-radius:24px;box-shadow:0 18px 50px rgba(15,75,64,.08);overflow:hidden}.head{padding:28px;background:linear-gradient(135deg,#087064,#07473f);color:#fff}.head p{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.16em}.head h1{margin:0;font-size:30px}.head .meta{margin-top:8px;color:rgba(255,255,255,.78);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:24px}.field{padding:17px;background:#f7faf9;border-radius:15px}.field small{display:block;color:#70847f;font-size:11px;margin-bottom:6px}.field strong{font-size:15px;word-break:break-word}.notice{margin:0 24px 24px;padding:15px 17px;background:#eaf6f2;border-radius:14px;color:#315c53;font-size:12px;line-height:1.5}.error{padding:36px;text-align:center}.error h1{font-size:24px}.error p{color:#687d78}@media(max-width:620px){.grid{grid-template-columns:1fr}.shell{margin:20px auto}.head{padding:22px}.head h1{font-size:24px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><img src="/images/gram-arogya-connect-logo.png" alt="Gram Arogya Connect"><div><strong>Gram Arogya Connect</strong><span>Secure shared health record</span></div></div>
    <section class="card" id="record"><div class="error"><h1>Opening shared record…</h1><p>Please wait while the secure link is verified.</p></div></section>
  </main>
  <script src="/js/doctor.js" defer></script>
</body>
</html>
