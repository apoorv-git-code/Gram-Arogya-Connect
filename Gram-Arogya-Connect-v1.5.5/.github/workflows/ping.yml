name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request to Render App
        run: |
          curl -I https://gram-arogya-connect.onrender.com/
